<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Katalog Produk · TIFood</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topbar" id="topbar"></header>

    <main>
        <section class="page-head">
            <div class="container">
                <h1>Katalog produk</h1>
                <p>Snack, makanan, dan minuman yang ada di stan TIFood.</p>
                <label class="search-box">🔍 <input id="search" type="search" placeholder="Cari produk, misalnya Oreo atau Pop Mie"></label>
            </div>
        </section>
        <div class="container">
            <div class="filters">
                <div class="options" id="category-buttons"></div>
                <div class="sort">
                    <select id="sort" aria-label="Urutkan produk">
                        <option value="price-asc">Harga termurah</option>
                        <option value="price-desc">Harga termahal</option>
                        <option value="name">Nama A–Z</option>
                    </select>
                </div>
            </div>
            <p class="result-count" id="result-count"></p>

            <div class="card-grid" id="card-grid"></div>
        </div>
    </main>

    <footer class="footer" id="footer"></footer>

    <script src="js/data.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/catalog.js"></script>
    <script>renderLayout("catalog"); renderCatalog(); setupReveal(".card");</script>
</body>
</html>
